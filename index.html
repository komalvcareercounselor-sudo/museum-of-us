<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum of Us</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .header-tag {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 15px;
        }
        .names {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
        }
        .highlight {
            color: #e74c3c;
            font-weight: bold;
        }
        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }
        .btn:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }
        .journey-content {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            animation: fadeIn 0.8s ease-in-out;
        }
        .journey-content h2 {
            color: #27ae60;
            margin-bottom: 10px;
        }
        .journey-content p {
            color: #666;
            line-height: 1.6;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-tag">Special Memory Collection</div>
        <h1>Museum of Us</h1>
        
        <!-- Yahan Receiver (Xyz) aur Sender (Abc) ke naam show honge -->
        <p class="names">
            For <span class="highlight">Xyz</span> ❤️<br>
            <small style="font-size: 14px; color: #777;">Created with care by <strong class="highlight">Abc</strong></small>
        </p>

        <!-- Main Trigger Button -->
        <button id="startBtn" class="btn">Start Journey ✨</button>

        <!-- Button click hone par yeh section show hoga -->
        <div id="journeySection" class="journey-content">
            <h2>Welcome to Our Journey! 🎉</h2>
            <p>Here begins the special gallery of memories shared between <strong>Abc</strong> and <strong>Xyz</strong>.</p>
        </div>
    </div>

    <script>
        // Button click logic
        document.getElementById('startBtn').addEventListener('click', function() {
            var section = document.getElementById('journeySection');
            var button = document.getElementById('startBtn');
            
            // Section ko display karega aur button hide ho jayega
            section.style.display = 'block';
            button.style.display = 'none';
        });
    </script>

</body>
</html>
